<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <filter id="cloudFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="4" seed="42" result="noise" />
      <feColorMatrix type="matrix" values="
        0.18 0  0 0 0.82
        0 0.18 0 0 0.83
        0 0 0.18 0 0.84
        0 0 0 1 0" in="noise" result="colored" />
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbcbcd" />
      <stop offset="50%" stop-color="#b8b8ba" />
      <stop offset="100%" stop-color="#d6d6d8" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#cloudGrad)" />
  <rect width="1920" height="1080" fill="#a8a8ac" filter="url(#cloudFilter)" opacity="0.65" />
</svg>
