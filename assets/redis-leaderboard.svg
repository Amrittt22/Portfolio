<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#14171f" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="16" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="110" x2="800" y2="110" />
    <line x1="0" y1="220" x2="800" y2="220" />
    <line x1="0" y1="330" x2="800" y2="330" />
    <line x1="0" y1="440" x2="800" y2="440" />
  </g>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="45" rx="8" fill="#181b22" stroke="#262a34" stroke-width="1" />
  <circle cx="55" cy="52" r="5" fill="#ef4444" />
  <circle cx="72" cy="52" r="5" fill="#f59e0b" />
  <circle cx="89" cy="52" r="5" fill="#10b981" />
  <text x="120" y="56" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">backend/server.js · express 4.21 · node-redis 4.7 · zset</text>

  <!-- Docker Compose Badge -->
  <rect x="622" y="42" width="138" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" />
  <circle cx="636" cy="53" r="3" fill="#10b981" />
  <text x="646" y="57" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">DOCKER COMPOSE</text>

  <!-- ===================================================== -->
  <!-- PANEL A · Browser frontend                           -->
  <!-- ===================================================== -->
  <rect x="30" y="95" width="200" height="345" rx="10" fill="#111318" stroke="#222630" stroke-width="1" />
  <text x="48" y="121" fill="#71717a" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">BROWSER FRONTEND</text>
  <text x="48" y="140" fill="#565b66" font-family="'DM Mono', monospace" font-size="9">frontend · served by express.static</text>

  <!-- polling box -->
  <rect x="48" y="152" width="164" height="86" rx="6" fill="#16181f" />
  <text x="60" y="175" fill="#10b981" font-family="'DM Mono', monospace" font-size="10">auto-refresh every 5 s</text>
  <text x="60" y="196" fill="#a1a1aa" font-family="'DM Mono', monospace" font-size="11">GET /leaderboard</text>
  <text x="60" y="217" fill="#71717a" font-family="'DM Mono', monospace" font-size="10">manual refresh button</text>

  <!-- top-10 list box -->
  <rect x="48" y="246" width="164" height="110" rx="6" fill="#16181f" />
  <text x="60" y="265" fill="#71717a" font-family="'DM Mono', monospace" font-size="8.5" letter-spacing="1">TOP 10 · REFRESHED LIVE</text>

  <!-- rank 1 -->
  <circle cx="68" cy="286" r="8" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="0.8" />
  <text x="65" y="290" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">1</text>
  <text x="84" y="290" fill="#fafafa" font-family="'DM Mono', monospace" font-size="11">alex</text>
  <text x="200" y="290" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="11" text-anchor="end">25</text>

  <!-- rank 2 -->
  <circle cx="68" cy="312" r="8" fill="#94a3b8" fill-opacity="0.12" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="0.8" />
  <text x="65" y="316" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">2</text>
  <text x="84" y="316" fill="#e4e4e7" font-family="'DM Mono', monospace" font-size="11">sam</text>
  <text x="200" y="316" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11" text-anchor="end">18</text>

  <!-- points row -->
  <circle cx="68" cy="338" r="8" fill="#262a34" />
  <text x="64" y="342" fill="#71717a" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">+</text>
  <text x="84" y="342" fill="#565b66" font-family="'DM Mono', monospace" font-size="9.5">add points from the UI</text>

  <!-- lookup note -->
  <rect x="48" y="364" width="164" height="52" rx="6" fill="#16181f" />
  <text x="60" y="385" fill="#a1a1aa" font-family="'DM Mono', monospace" font-size="9.5">rank and score lookups</text>
  <text x="60" y="405" fill="#71717a" font-family="'DM Mono', monospace" font-size="9.5">empty set → "No scores yet"</text>

  <!-- ===================================================== -->
  <!-- PANEL B · Express API                                -->
  <!-- ===================================================== -->
  <rect x="255" y="95" width="200" height="345" rx="10" fill="#111318" stroke="#222630" stroke-width="1" />
  <text x="272" y="121" fill="#71717a" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">EXPRESS API · :3000</text>
  <text x="272" y="140" fill="#565b66" font-family="'DM Mono', monospace" font-size="9">backend/server.js · validates every write</text>

  <!-- route 1: views -->
  <rect x="268" y="152" width="174" height="56" rx="6" fill="#16181f" />
  <text x="278" y="172" fill="#fafafa" font-family="'DM Mono', monospace" font-size="9.5">POST /posts/:id/views</text>
  <text x="278" y="192" fill="#ef4444" font-family="'DM Mono', monospace" font-size="10">→ INCR post:views:(id)</text>

  <!-- route 2: points -->
  <rect x="268" y="216" width="174" height="56" rx="6" fill="#16181f" />
  <text x="278" y="236" fill="#fafafa" font-family="'DM Mono', monospace" font-size="9.5">POST /users/:id/points</text>
  <text x="278" y="256" fill="#ef4444" font-family="'DM Mono', monospace" font-size="10">→ ZINCRBY key +points</text>

  <!-- route 3: leaderboard -->
  <rect x="268" y="280" width="174" height="64" rx="6" fill="#16181f" />
  <text x="278" y="300" fill="#fafafa" font-family="'DM Mono', monospace" font-size="9.5">GET /leaderboard</text>
  <text x="278" y="320" fill="#ef4444" font-family="'DM Mono', monospace" font-size="10">→ ZREVRANGE 0 9</text>
  <text x="278" y="336" fill="#71717a" font-family="'DM Mono', monospace" font-size="8.5">top 10 · rank starts at 1</text>

  <!-- route 4: rank -->
  <rect x="268" y="352" width="174" height="56" rx="6" fill="#16181f" />
  <text x="278" y="372" fill="#fafafa" font-family="'DM Mono', monospace" font-size="9.5">GET /leaderboard/:id/rank</text>
  <text x="278" y="392" fill="#ef4444" font-family="'DM Mono', monospace" font-size="10">→ ZREVRANK + score</text>

  <!-- guard chip -->
  <rect x="268" y="410" width="174" height="20" rx="10" fill="#1a1d25" stroke="#262a34" stroke-width="1" />
  <text x="355" y="424" fill="#71717a" font-family="'DM Mono', monospace" font-size="8.5" text-anchor="middle">400 · 404 · 413 · 503 guards · bodies ≤ 16 KB</text>

  <!-- ===================================================== -->
  <!-- PANEL C · Redis                                      -->
  <!-- ===================================================== -->
  <rect x="485" y="95" width="295" height="345" rx="10" fill="#111318" stroke="#222630" stroke-width="1" />
  <text x="503" y="121" fill="#71717a" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">REDIS 7 · SORTED SET</text>
  <text x="503" y="140" fill="#565b66" font-family="'DM Mono', monospace" font-size="9">node-redis createClient · single ZSET</text>

  <!-- key chip -->
  <rect x="503" y="150" width="140" height="24" rx="6" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1" />
  <text x="513" y="166" fill="#ef4444" font-family="'DM Mono', monospace" font-size="10">leaderboard:users</text>

  <!-- ladder -->
  <rect x="503" y="184" width="262" height="118" rx="6" fill="#16181f" />
  <text x="515" y="204" fill="#71717a" font-family="'DM Mono', monospace" font-size="8.5" letter-spacing="0.5">MEMBERS · SCORE DESC · ZREVRANGE</text>

  <!-- member row 1 -->
  <text x="515" y="230" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="12">25</text>
  <text x="548" y="230" fill="#fafafa" font-family="'DM Mono', monospace" font-size="11">"alex"</text>
  <rect x="700" y="214" width="52" height="22" rx="4" fill="#fbbf24" fill-opacity="0.1" />
  <text x="706" y="229" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="9.5">rank 1</text>
  <line x1="515" y1="240" x2="753" y2="240" stroke="#262a34" stroke-width="1" />

  <!-- member row 2 -->
  <text x="515" y="264" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="12">18</text>
  <text x="548" y="264" fill="#e4e4e7" font-family="'DM Mono', monospace" font-size="11">"sam"</text>
  <rect x="700" y="248" width="52" height="22" rx="4" fill="#94a3b8" fill-opacity="0.08" />
  <text x="706" y="263" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="9.5">rank 2</text>
  <line x1="515" y1="274" x2="753" y2="274" stroke="#262a34" stroke-width="1" />

  <!-- member row 3 -->
  <text x="515" y="296" fill="#3f444f" font-family="'DM Mono', monospace" font-size="12">…</text>
  <text x="548" y="296" fill="#565b66" font-family="'DM Mono', monospace" font-size="10">ZREVRANK lookup → 404 if absent</text>

  <!-- views counter box -->
  <rect x="503" y="312" width="262" height="54" rx="6" fill="#16181f" />
  <text x="515" y="334" fill="#ef4444" font-family="'DM Mono', monospace" font-size="10.5">post:views:article-42</text>
  <text x="515" y="354" fill="#a1a1aa" font-family="'DM Mono', monospace" font-size="9.5">INCR → 1 · atomic view counter</text>

  <!-- volume chip -->
  <rect x="503" y="376" width="262" height="24" rx="12" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="517" cy="388" r="3" fill="#10b981" />
  <text x="526" y="392" fill="#10b981" font-family="'DM Mono', monospace" font-size="9.5">volume redis-data · state survives restarts</text>

  <!-- observable behavior chip -->
  <rect x="503" y="408" width="262" height="22" rx="11" fill="#1a1d25" stroke="#262a34" stroke-width="1" />
  <text x="515" y="422" fill="#565b66" font-family="'DM Mono', monospace" font-size="9">503 while redis down · UI still loads</text>

  <!-- ===================================================== -->
  <!-- Flow arrows                                          -->
  <!-- ===================================================== -->
  <!-- browser polls API -->
  <line x1="232" y1="210" x2="249" y2="210" stroke="#3a404d" stroke-width="1.5" />
  <polygon points="249,206 255,210 249,214" fill="#3a404d" />
  <!-- API writes Redis -->
  <line x1="457" y1="200" x2="479" y2="200" stroke="#ef4444" stroke-width="1.5" />
  <polygon points="479,196 485,200 479,204" fill="#ef4444" />
  <!-- Redis serves rankings -->
  <line x1="483" y1="252" x2="261" y2="252" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" />
  <polygon points="261,248 255,252 261,256" fill="#10b981" />

  <!-- ===================================================== -->
  <!-- Docker Compose strip                                 -->
  <!-- ===================================================== -->
  <rect x="30" y="452" width="3" height="30" rx="1.5" fill="url(#accent)" />
  <rect x="33" y="452" width="737" height="30" rx="8" fill="#16181f" stroke="#222630" stroke-width="1" />
  <text x="47" y="471" fill="#a1a1aa" font-family="'DM Mono', monospace" font-size="9.5">compose.yaml → app: Node 18 ⇄ redis:7-alpine · healthcheck redis-cli ping (5s) · volume redis-data · 127.0.0.1:(HOST_PORT)→3000</text>
</svg>
